<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 633" role="img" aria-labelledby="title desc"><title id="title">How Rulebook turns disagreement into a guideline rule</title><desc id="desc">Receipts are read by OCR and labeled by three local models. Disagreements are clustered, an orchestrator picks clusters, a diagnoser names the cause, a rule writer drafts a rule and a code verifier tests it. A human approves, edits or rejects it. An approved rule creates a new guideline version, the batch is relabeled, and the next batch starts from the new version.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5344b2"/></marker></defs><rect width="680" height="633" fill="#fcfcfa"/><g fill="none" stroke="#5344b2" stroke-width="2" marker-end="url(#arrow)"><path d="M340 77v24"/><path d="M340 153v24"/><path d="M340 229v24"/><path d="M340 305v24"/><path d="M340 381v24"/><path d="M340 457v24"/><path d="M340 533v24"/><path stroke-dasharray="5 4" d="M530 583.0H610V127.0H532"/></g><g fill="#ffffff" stroke="#b9bec8"><rect x="150" y="25" width="380" height="52" rx="2"/><rect x="150" y="101" width="380" height="52" rx="2"/><rect x="150" y="177" width="380" height="52" rx="2"/><rect x="150" y="253" width="380" height="52" rx="2"/><rect x="150" y="329" width="380" height="52" rx="2"/><rect x="150" y="405" width="380" height="52" rx="2"/><rect x="150" y="481" width="380" height="52" rx="2"/><rect x="150" y="557" width="380" height="52" rx="2"/></g><rect x="150" y="481" width="380" height="3" fill="#a6cb31"/><g fill="#17263c" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="600"><text x="340" y="48">Receipt images → OCR</text><text x="340" y="124">Three local labelers</text><text x="340" y="200">Cluster the disagreements</text><text x="340" y="276">Orchestrator agent</text><text x="340" y="352">Diagnoser agent</text><text x="340" y="428">Rule writer + code verifier</text><text x="340" y="504">Human review</text><text x="340" y="580">Guideline vN+1, relabel</text></g><g fill="#43506a" text-anchor="middle" font-family="DM Mono, monospace" font-size="12"><text x="340" y="66">PaddleOCR on CPU, CORD v2 receipts</text><text x="340" y="142">qwen3.5 · llama3.1 · gemma4, guideline vN</text><text x="340" y="218">All-agree, confident words are accepted</text><text x="340" y="294">Picks clusters and gives a reason</text><text x="340" y="370">OCR error · model error · ambiguous · guideline gap</text><text x="340" y="446">Drafts one rule; gold set and no-op control</text><text x="340" y="522">Approve · edit · reject</text><text x="340" y="598">Then the next batch starts from vN+1</text><text x="615" y="355.0" transform="rotate(90 615 355.0)" text-anchor="middle" fill="#5344b2" font-size="11" letter-spacing="1.2">NEXT BATCH</text></g></svg>