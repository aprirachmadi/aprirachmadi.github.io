<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" role="img" aria-labelledby="title desc"><title id="title">How Tilik answers a statistical question</title><desc id="desc">A question is interpreted and routed to read-only observation lookup, publication retrieval, or both. Requested statistical analysis runs in deterministic Python over validated series. Gathered evidence is used to write an answer with source identifiers and an optional chart specification.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#145b60"/></marker></defs><rect width="680" height="540" fill="#f3f0e9"/><g fill="none" stroke="#145b60" stroke-width="2" marker-end="url(#arrow)"><path d="M340 80v35"/><path d="M340 170v25H170v30"/><path d="M340 195h170v30"/><path d="M170 295v30h170v30"/><path d="M510 295v30H340"/><path d="M340 415v35"/></g><g fill="#fffdf8" stroke="#c8d0cb"><rect x="150" y="25" width="380" height="55" rx="4"/><rect x="150" y="115" width="380" height="55" rx="4"/><rect x="30" y="225" width="280" height="70" rx="4"/><rect x="370" y="225" width="280" height="70" rx="4"/><rect x="150" y="355" width="380" height="60" rx="4"/><rect x="150" y="450" width="380" height="65" rx="4"/></g><g fill="#193b40" text-anchor="middle" font-family="sans-serif" font-size="19"><text x="340" y="59">Question + conversation context</text><text x="340" y="149">Interpret request · choose sources</text><text x="170" y="253">Published observations</text><text x="510" y="253">Publication excerpts</text><text x="340" y="380">Requested statistical analysis</text><text x="340" y="477">Answer + source identifiers</text></g><g fill="#45666a" text-anchor="middle" font-family="sans-serif" font-size="15"><text x="170" y="278">Read-only PostgreSQL tools</text><text x="510" y="278">pgvector · grade · bounded rewrite</text><text x="340" y="401">Validated series → Python computation</text><text x="340" y="500">Optional chart specification</text></g></svg>