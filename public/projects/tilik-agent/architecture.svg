<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" role="img" aria-labelledby="title desc"><title id="title">How Tilik answers a question across five sources</title><desc id="desc">A question is interpreted and routed to one MCP server per source: BPS, BNPB, BMKG, Bapanas or SiPongi. Requested statistical analysis runs in deterministic Python. The answer is written with cited evidence IDs checked, and returned with source chips and an optional chart.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5344b2"/></marker></defs><rect width="680" height="590" fill="#fcfcfa"/><g fill="none" stroke="#5344b2" stroke-width="2" marker-end="url(#arrow)"><path d="M340 75v30"/><path d="M340 155v15"/></g><g fill="none" stroke="#5344b2" stroke-width="2"><path d="M80 175H600"/><path d="M340 155V175"/></g><g fill="none" stroke="#5344b2" stroke-width="2" marker-end="url(#arrow)"><path d="M80 175V205"/><path d="M210 175V205"/><path d="M340 175V205"/><path d="M470 175V205"/><path d="M600 175V205"/></g><g fill="none" stroke="#5344b2" stroke-width="2"><path d="M80 275V300H600V275"/><path d="M210 275V300"/><path d="M340 275V300"/><path d="M470 275V300"/></g><g fill="none" stroke="#5344b2" stroke-width="2" marker-end="url(#arrow)"><path d="M340 300V330"/><path d="M340 390V420"/><path d="M340 485V515"/></g><g fill="#ffffff" stroke="#b9bec8"><rect x="150" y="25" width="380" height="50" rx="2"/><rect x="150" y="105" width="380" height="50" rx="2"/><rect x="19" y="205" width="122" height="70" rx="2"/><rect x="149" y="205" width="122" height="70" rx="2"/><rect x="279" y="205" width="122" height="70" rx="2"/><rect x="409" y="205" width="122" height="70" rx="2"/><rect x="539" y="205" width="122" height="70" rx="2"/><rect x="150" y="330" width="380" height="60" rx="2"/><rect x="150" y="420" width="380" height="65" rx="2"/><rect x="150" y="515" width="380" height="55" rx="2"/></g><rect x="19" y="205" width="122" height="3" fill="#a6cb31"/><rect x="149" y="205" width="122" height="3" fill="#a6cb31"/><rect x="279" y="205" width="122" height="3" fill="#a6cb31"/><rect x="409" y="205" width="122" height="3" fill="#a6cb31"/><rect x="539" y="205" width="122" height="3" fill="#a6cb31"/><g fill="#17263c" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="600"><text x="340" y="56">Question + conversation context</text><text x="340" y="136">Interpret request · choose sources</text><text x="80" y="238">BPS</text><text x="210" y="238">BNPB</text><text x="340" y="238">BMKG</text><text x="470" y="238">Bapanas</text><text x="600" y="238">SiPongi</text><text x="340" y="365">Optional statistical analysis</text><text x="340" y="450">write_answer</text><text x="340" y="548">Answer + source chips</text></g><g fill="#43506a" text-anchor="middle" font-family="DM Mono, monospace" font-size="12"><text x="80" y="256">Observations</text><text x="80" y="270">+ SP2020</text><text x="210" y="256">Disaster</text><text x="210" y="270">aggregates</text><text x="340" y="256">Live</text><text x="340" y="270">feeds</text><text x="470" y="256">Food</text><text x="470" y="270">prices</text><text x="600" y="256">Hotspot</text><text x="600" y="270">counts</text><text x="340" y="381">Validated series → Python computation</text><text x="340" y="470">Check cited evidence IDs</text><text x="340" y="565" font-size="12">Optional chart specification</text></g></svg>