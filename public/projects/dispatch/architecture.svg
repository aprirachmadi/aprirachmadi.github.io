<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="title desc"><title id="title">Dispatch: from ticket to human review</title><desc id="desc">Read ticket and company context through MCP, retrieve historical resolutions, classify and draft. Preview stops before writes. Apply generates again and saves an unsent draft. A technician reviews and approves a saved revision. No sending.</desc><rect width="640" height="540" fill="#f4f3ee"/><g font-family="Inter,Arial,sans-serif" fill="#183d4a"><text x="36" y="48" font-size="23" font-weight="600">Context before a draft.</text><g fill="none" stroke="#1d6477" stroke-width="1.5"><path d="M320 128v27m0 65v27m0 65v27m0 65v27"/><path d="m315 149 5 6 5-6m-10 92 5 6 5-6m-10 92 5 6 5-6m-10 92 5 6 5-6"/></g><rect x="36" y="78" width="568" height="65" fill="#fff" stroke="#c5d0d3"/><text x="54" y="104" font-size="18" font-weight="600">Ticket + company context</text><text x="54" y="127" font-size="14" fill="#43616d">MCP read tools</text><rect x="36" y="170" width="568" height="65" fill="#fff" stroke="#c5d0d3"/><text x="54" y="196" font-size="18" font-weight="600">Historical resolutions</text><text x="54" y="219" font-size="14" fill="#43616d">Similarity retrieval · resolved tickets</text><rect x="36" y="262" width="568" height="65" fill="#fff" stroke="#c5d0d3"/><text x="54" y="288" font-size="18" font-weight="600">Classification + response draft</text><text x="54" y="311" font-size="14" fill="#43616d">Separate model calls</text><rect x="36" y="354" width="568" height="65" fill="#fff" stroke="#c5d0d3"/><text x="54" y="380" font-size="18" font-weight="600">Apply: save for review</text><text x="54" y="403" font-size="14" fill="#43616d">Labels + assessment + unsent draft</text><rect x="36" y="446" width="568" height="65" fill="#fff" stroke="#c5d0d3"/><text x="54" y="472" font-size="18" font-weight="600">Technician: inspect, edit, approve</text><text x="54" y="495" font-size="14" fill="#43616d">Revision checked · always unsent</text></g></svg>